steps:
  # Build the Docker image (token passed as build arg so Vite bakes it in)
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - --build-arg
      - VITE_AIRTABLE_TOKEN=$_AIRTABLE_TOKEN
      - -t
      - us-central1-docker.pkg.dev/sym-marketing-intel/sym-marketing/app:$COMMIT_SHA
      - -t
      - us-central1-docker.pkg.dev/sym-marketing-intel/sym-marketing/app:latest
      - .

  # Push to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - --all-tags
      - us-central1-docker.pkg.dev/sym-marketing-intel/sym-marketing/app

  # Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - sym-marketing
      - --image=us-central1-docker.pkg.dev/sym-marketing-intel/sym-marketing/app:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --no-allow-unauthenticated
      - --memory=256Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3

images:
  - us-central1-docker.pkg.dev/sym-marketing-intel/sym-marketing/app:$COMMIT_SHA
  - us-central1-docker.pkg.dev/sym-marketing-intel/sym-marketing/app:latest

substitutions:
  _AIRTABLE_TOKEN: ""

options:
  logging: CLOUD_LOGGING_ONLY
