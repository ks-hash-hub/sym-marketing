server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy Chartmetric API to avoid CORS (browser can't call api.chartmetric.com directly)
    location /cm-api/ {
        proxy_pass https://api.chartmetric.com/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.chartmetric.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "*";
    }

    # SPA routing — all paths fall back to index.html so React Router handles them
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively, never cache the HTML entry point
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1000;
}
